# Databricks Asset Bundle config for the AI Movie Night Planner.
# Deploy with: databricks bundle deploy -t dev   (or -t prod)
# Bundled resources (jobs) are wired up under resources/*.yml. The embeddings
# pipeline job is added in phase P6 of docs/MOVIE_NIGHT_PLAN.md.

bundle:
  name: databricks-ai-bootcamp-capstone

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
